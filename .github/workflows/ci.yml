# py-qa-ci runs its own pipeline on itself: the bundled Pylint defences, the suppression
# scan, the record and the documentation check all run on this source exactly as they run in a
# consuming project. CI is set, so the formatter checks rather than fixes.
name: CI

# A push that changes only documentation starts no run; pull requests are never filtered.
# CHANGELOG.md stays in (tests/py_qa/test_release.py holds its latest heading to the version), and
# so does src/ whole (the bundled defence pages). README.md, which that test also reads, is left
# out: a README-only change is tested on its pull request.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "CHANGELOG.md"
      - "src/**"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - ".claude/**"
      - ".github/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # uv from PyPI, pinned, so the lock file is read by the version that wrote it.
      - name: Install
        run: |
          python -m pip install uv==0.12.24
          uv sync --locked --python "$(command -v python)"
      - name: py-qa run
        run: uv run py-qa run

  # The workflow lint (LongTermSupport/actions-qa-ci), on pull requests.
  actions-qa-ci:
    name: actions-qa-ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: LongTermSupport/actions-qa-ci@2784a484769348f14ed780db9b45cd3a402bf31e # v0.1.0
